name: README build
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"

env:
  # Single source of truth for the interpreter: used both to install Python and to key the
  # pip cache, so a future version bump can never silently reuse another version's wheels.
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Get Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configure pip cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-${{ hashFiles('cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-py${{ env.PYTHON_VERSION }}-
      - name: Install dependencies
        # --only-binary=:all: forbids pip from falling back to a source build. Without it a
        # missing wheel silently becomes a C compile against the libxml2/libxslt headers the
        # runner does not have -- which is exactly how this job broke on 2026-09-03. With it,
        # a missing wheel fails immediately and names the package.
        # (Block scalar, not a plain one: ":all: " would otherwise parse as a YAML mapping.)
        run: |
          python -m pip install --only-binary=:all: -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@vszlx4.github.io"
          git config --global user.name "vszlx4/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
