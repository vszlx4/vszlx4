name: Dashboard

on:
  push:
    branches: [main, dashboard-redesign]
    paths-ignore: [dashboard.svg]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # File lists of past commits never change, so they are kept between runs instead of refetched.
      - name: Restore commit cache
        uses: actions/cache@v5
        with:
          path: .cache/commit-files.json
          key: commit-files-${{ github.run_id }}
          restore-keys: commit-files-

      - name: Build dashboard
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python -m dashboard

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.svg
          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
          else
            git commit -m "Update dashboard"
            git push
          fi
